name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Two pushes landing on main seconds apart (a merge followed by the release
# commit) used to run the full matrix twice against contended runners, which
# is what tipped the Windows job over its test timeout. Supersede instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS pinned to 15: GitHub's macos-latest (macOS 26) ships a dyld that
        # rejects Go 1.22's -race test binaries ("missing LC_UUID load command"
        # -> abort trap, before any test runs). Go 1.23+ fixes the linker; pin
        # until Go 1.22 (EOL) is dropped from the matrix.
        os: [ubuntu-latest, macos-15, windows-latest]
        go: ['1.22.x', '1.23.x']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go build -v ./...
      # -timeout is a deadlock detector, not a performance budget. At 90s it
      # was doing both jobs and failing at both: the suite spawns a git process
      # per fixture repo, Windows spawns processes an order of magnitude slower
      # than Linux, and the run landed close enough to the limit that the same
      # commit passed on one Go version and timed out on the other. The helpers
      # now spawn ~half as many processes; this leaves real headroom on top so
      # a genuine hang is still caught, loudly, and slowness never masquerades
      # as one.
      - name: Test (race, except Windows)
        if: runner.os != 'Windows'
        run: go test -count=1 -race -timeout 300s ./...
      - name: Test (no race on Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 300s ./...

  extension:
    name: extension (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Lint package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
