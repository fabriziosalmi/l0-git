name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Two pushes landing on main seconds apart (a merge followed by the release
# commit) used to run the full matrix twice against contended runners, which
# is what tipped the Windows job over its test timeout. Supersede instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The macos-15 pin is gone with Go 1.22: it existed because macOS 26's
        # dyld rejects Go 1.22's -race test binaries ("missing LC_UUID load
        # command"), and the comment said to drop it once 1.22 left the matrix.
        #
        # 1.25 is the floor because golang.org/x/net v0.55.0+ requires it, and
        # that is the first release carrying the fix for GHSA-5cv4-jp36-h3mw —
        # a DoS in the HTML parser html_lint runs over untrusted repositories.
        # 1.22 and 1.23 are both EOL, so this is the supported pair, not a
        # narrowing.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.x', '1.26.x']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go build -v ./...
      # -timeout is a deadlock detector, not a performance budget. At 90s it
      # was doing both jobs and failing at both: the suite spawns a git process
      # per fixture repo, Windows spawns processes an order of magnitude slower
      # than Linux, and the run landed close enough to the limit that the same
      # commit passed on one Go version and timed out on the other. The helpers
      # now spawn ~half as many processes; this leaves real headroom on top so
      # a genuine hang is still caught, loudly, and slowness never masquerades
      # as one.
      - name: Test (race, except Windows)
        if: runner.os != 'Windows'
        run: go test -count=1 -race -timeout 300s ./...
      - name: Test (no race on Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 300s ./...

  extension:
    name: extension (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Lint package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
