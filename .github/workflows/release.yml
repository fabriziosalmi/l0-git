name: release

on:
  push:
    tags: ['v*']
  # A dry run: builds, signs and notarizes everything and uploads it as
  # workflow artifacts, but publishes no release and does not touch the tap
  # (both jobs only run for a tag). A pull request that changes the release
  # pipeline gets one, so a broken pipeline shows up before the tag does.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/install.sh
      - scripts/macos-sign.sh
      - scripts/bump-formula.sh
      - extension/scripts/build-bins.sh
  workflow_dispatch:

permissions:
  contents: write

env:
  # The tag (v0.3.3) on a release, a version that cannot be mistaken for one
  # on a dry run. Steps strip the leading v.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-dryrun.{0}', github.run_number) }}

jobs:
  build-binaries:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - name: Build ${{ matrix.target }}
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${VERSION#v}"
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w -X main.Version=${version}" \
            -o "../dist/lgit-${{ matrix.target }}${{ matrix.ext }}" .
      - name: Archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "lgit-${{ matrix.target }}.zip" "lgit-${{ matrix.target }}${{ matrix.ext }}"
          else
            tar -czf "lgit-${{ matrix.target }}.tar.gz" "lgit-${{ matrix.target }}${{ matrix.ext }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: lgit-${{ matrix.target }}
          path: |
            dist/lgit-${{ matrix.target }}.tar.gz
            dist/lgit-${{ matrix.target }}.zip
          if-no-files-found: ignore

  # macOS binaries are built on a macOS runner so they can be signed with
  # the Developer ID and notarized: without that, a binary downloaded with a
  # browser is blocked by Gatekeeper. scripts/macos-sign.sh fails the job
  # unless Gatekeeper accepts the result as notarized, so a release never
  # ships an unsigned darwin binary.
  build-darwin:
    name: darwin (signed, notarized)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - name: Build darwin-amd64 and darwin-arm64
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          version="${VERSION#v}"
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.Version=${version}" \
              -o "../dist/lgit-darwin-$arch" .
          done
      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERT_P12_BASE64" || { echo "MACOS_CERT_P12_BASE64 is not set" >&2; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" >/dev/null
          # Put the signing keychain first on the search list, keep the others.
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$kc" "${existing[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"
      - name: Sign, notarize, check Gatekeeper
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          scripts/macos-sign.sh dist/lgit-darwin-amd64 dist/lgit-darwin-arm64
          rm -f "$APPLE_API_KEY_PATH"
      - name: Archive
        run: |
          cd dist
          for arch in amd64 arm64; do
            tar -czf "lgit-darwin-$arch.tar.gz" "lgit-darwin-$arch"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: lgit-darwin
          path: dist/lgit-darwin-*.tar.gz
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  build-extension:
    name: vsix
    runs-on: ubuntu-latest
    needs: [build-binaries, build-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Cross-compile bundled binaries
        working-directory: extension
        run: ./scripts/build-bins.sh
      - uses: actions/download-artifact@v8
        with:
          name: lgit-darwin
          path: darwin-signed
      - name: Bundle the signed darwin binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            tar -xzf "darwin-signed/lgit-darwin-$arch.tar.gz" -C darwin-signed
            cp "darwin-signed/lgit-darwin-$arch" "extension/bin/darwin-$arch/lgit"
          done
      - name: Install extension deps
        working-directory: extension
        run: npm ci
      - name: Package vsix
        working-directory: extension
        run: |
          npx --yes @vscode/vsce package --out "l0-git-${VERSION#v}.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: extension/*.vsix

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-darwin, build-extension]
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' \) -exec cp {} release/ \;
          cp scripts/install.sh release/
          (cd release && sha256sum -- * > checksums.txt)
          ls -la release/
          cat release/checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

  # Point the Homebrew tap at this release. Needs a HOMEBREW_TAP_TOKEN secret:
  # a fine-grained PAT with contents: write on fabriziosalmi/homebrew-l0-git.
  # It runs after the release is published, so a failure here leaves the
  # release intact and the tap one version behind.
  bump-homebrew:
    name: bump homebrew formula
    needs: release
    runs-on: ubuntu-latest
    # Stable tags only: the tap tracks releases, not rc/beta.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: l0-git
      - uses: actions/checkout@v7
        with:
          repository: fabriziosalmi/homebrew-l0-git
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Bump formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir .
          l0-git/scripts/bump-formula.sh tap/Formula/l0-git.rb "$GITHUB_REF_NAME" checksums.txt
          git -C tap diff
      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "formula already at $GITHUB_REF_NAME"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: l0-git ${GITHUB_REF_NAME}"
          git push
