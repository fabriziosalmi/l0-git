<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="566" viewBox="0 0 1120 566" role="img" aria-label="Architecture: VS Code extension, MCP clients and the shell all drive one lgit binary that reads the working tree and git index and persists findings to a shared SQLite store">
<title>l0-git architecture</title>
