<rect x="830" y="170" width="250" height="110" rx="10" fill="#14161B" stroke="#5FD08A"/>
<text x="955" y="202" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" letter-spacing="0" fill="#5FD08A">~/.l0-git/findings.db</text>
<text x="955" y="226" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" letter-spacing="0" fill="#8A90A0">SQLite · WAL · shared</text>
