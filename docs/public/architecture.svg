<text x="362" y="200" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" letter-spacing="0" fill="#666C7C">JSON-RPC · stdio</text>
