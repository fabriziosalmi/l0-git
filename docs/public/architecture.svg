<text x="60" y="300" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" letter-spacing="0" fill="#E4E7EE">Shell · CI · Makefile</text>
<text x="60" y="323" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" letter-spacing="0" fill="#8A90A0">lgit check / list / fix</text>
