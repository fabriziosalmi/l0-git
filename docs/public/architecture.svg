<text x="60" y="127" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" letter-spacing="0" fill="#8A90A0">sidebar · Problems · status bar</text>
