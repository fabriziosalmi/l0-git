<text x="26" y="274.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#5FD08A">$ </tspan><tspan fill="#EAECF2">lgit fix 16</tspan></text>
<text x="26" y="295.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#6A7080">l0-git finding </tspan><tspan fill="#EAECF2">#16</tspan><tspan fill="#6A7080"> — </tspan><tspan fill="#A9B4FF">ide_artifact_tracked</tspan><tspan fill="#6A7080"> (</tspan><tspan fill="#E3B341">warning</tspan><tspan fill="#6A7080">)</tspan></text>
<text x="26" y="316.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#EAECF2">Editor/IDE artefact tracked in git</tspan></text>
<text x="26" y="337.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#6A7080">Location: </tspan><tspan fill="#C6CBD5">.idea/workspace.xml</tspan></text>
<text x="26" y="379.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#EAECF2">Detected</tspan></text>
<text x="26" y="400.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan>  .idea/workspace.xml is a user-local editor/IDE/OS artefact and shouldn&#x27;t</tspan></text>
<text x="26" y="421.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan>  live in shared history. Add it to .gitignore and remove with `git rm</tspan></text>
<text x="26" y="442.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan>  --cached .idea/workspace.xml`.</tspan></text>
<text x="26" y="484.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#EAECF2">Fix</tspan></text>
<text x="26" y="505.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan>  Untrack .idea/workspace.xml and ignore it going forward.</tspan></text>
<text x="26" y="547.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#EAECF2">Run</tspan></text>
<text x="26" y="568.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#5FD08A">  $ </tspan><tspan fill="#EAECF2">git rm --cached .idea/workspace.xml</tspan></text>
<text x="26" y="589.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#6A7080">      remove from the index, leave on disk</tspan></text>
<text x="26" y="610.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#5FD08A">  $ </tspan><tspan fill="#EAECF2">git commit -m &#x27;untrack editor artefact .idea/workspace.xml&#x27;</tspan></text>
<text x="26" y="652.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#EAECF2">Edit</tspan></text>
<text x="26" y="673.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#6A7080">  append to .gitignore:</tspan></text>
<text x="26" y="694.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#C6CBD5">    .idea/</tspan></text>
<text x="26" y="736.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#EAECF2">Confidence</tspan></text>
<text x="26" y="757.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#5FD08A">  deterministic</tspan></text>
