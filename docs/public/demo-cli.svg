<text x="26" y="85.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan>{</tspan></text>
