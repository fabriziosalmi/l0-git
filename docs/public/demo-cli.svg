<text x="26" y="127.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#8FB8FF">  &quot;findings&quot;: </tspan><tspan fill="#E3B341">19</tspan></text>
<text x="26" y="148.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan>}</tspan></text>
<text x="26" y="190.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#5FD08A">$ </tspan><tspan fill="#EAECF2">lgit list -project=$PWD -severity=error | jq -r &#x27;.[].file_path&#x27;</tspan></text>
<text x="26" y="211.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#C6CBD5"><tspan fill="#FF7B72">src/index.js</tspan></text>
