<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="l0-git — deterministic quality gates for the open workspace">
  <title>l0-git — deterministic quality gates for the open workspace</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.028"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#5A6B9E" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0B0C0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="16" fill="#0B0C0F"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#23262E"/>

  <!-- mark -->
  <g transform="translate(564 64) scale(1.125)">
    <rect width="64" height="64" rx="15" fill="#F2F3F7"/>
    <rect x="13" y="15" width="6.5" height="34" rx="3.25" fill="#0B0C0F"/>
    <circle cx="38" cy="36.5" r="10.25" fill="none" stroke="#0B0C0F" stroke-width="5.4"/>
    <path d="M30.4 44.6 45.6 28.4" fill="none" stroke="#0B0C0F" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <text x="600" y="226" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="66" font-weight="600" letter-spacing="-2.4" fill="#F5F6F8">l0-git</text>

  <text x="600" y="266" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="20" fill="#9AA1B1">Deterministic quality gates for the open workspace</text>

  <path d="M470 300h260" stroke="#23262E" stroke-width="1"/>

  <text x="600" y="326" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="13.5" letter-spacing="0.4" fill="#6A7080">35 gates · one Go binary · MCP server · VS Code extension</text>
</svg>
